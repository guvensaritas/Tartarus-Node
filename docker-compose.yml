version: '3.8'

services:
  tartarus-node:
    build: .
    container_name: tartarus_engine
    restart: unless-stopped
    
    # === SECURE PORT MAPPING ===
    ports:
      - "2222:2222"           # Honeypot SSH listener
      - "8080:8080"           # Secured SOC Dashboard
    
    # === LLM ENGINE ===
    depends_on:
      - ollama
    
    volumes:
      - ./state_memory:/app/state_memory
      - ./quarantine:/app/quarantine
      - ./config.json:/app/config.json:ro   # Read-only configuration
    
    # === ISOLATED NETWORK ===
    networks:
      - tartarus-net

  ollama:
    image: ollama/ollama:latest
    container_name: tartarus-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - tartarus-net

networks:
  tartarus-net:
    driver: bridge
    ipam:
      driver: default

volumes:
  ollama-data:
    name: tartarus-ollama-data